<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Фон: Тёмно-синий аккуратный градиент в стиле приложения -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Иконка: Фирменный градиент Indigo-to-Cyan -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Тень под иконкой -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Скругленный квадрат (фон приложения) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>
  
  <!-- Внутренняя рамка с подсветом -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Логотип: Круговые стрелки конвертации -->
  <g filter="url(#shadow)" fill="url(#iconGradient)">
    <!-- Верхняя стрелка -->
    <path d="M160 216c0-48.6 39.4-88 88-88h98.7l-35.3-35.3c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l76 76c9.4 9.4 9.4 24.6 0 33.9l-76 76c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l35.3-35.3H248c-22.1 0-40 17.9-40 40 0 13.3-10.7 24-24 24s-24-10.7-24-24z"/>
    <!-- Нижняя стрелка -->
    <path d="M352 296c0 48.6-39.4 88-88 88H165.3l35.3 35.3c9.4 9.4 9.4 24.6 0 33.9s-24.6 9.4-33.9 0l-76-76c-9.4-9.4-9.4-24.6 0-33.9l76-76c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9L165.3 336H264c22.1 0 40-17.9 40-40 0-13.3 10.7-24 24-24s24 10.7 24 24z"/>
  </g>
</svg>
